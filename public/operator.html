.strategy-card {
  background:rgba(255,184,41,.04);
  border:1px solid rgba(255,184,41,.18);
  border-radius:18px;
  padding:24px 26px;
  margin-top:14px;
}
.strategy-card-hd    { display:flex; align-items:flex-start; gap:12px; margin-bottom:10px; }
.strategy-card-icon  { font-size:1.4rem; line-height:1.1; }
.strategy-card-title { font-size:1.05rem; font-weight:700; color:var(--gold-2); }
.strategy-card-sub   { font-size:.78rem; color:var(--text-2); margin-top:2px; }
.strategy-card-lead  {
  font-size:.85rem; color:var(--text-2); line-height:1.7;
  margin:0 0 16px; padding:12px 14px;
  background:rgba(255,255,255,.025); border-radius:10px;
  border-left:2px solid rgba(255,184,41,.25);
}
.strategy-card-lead b { color:var(--text-1); }
.strategy-items { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media(max-width:580px) { .strategy-items { grid-template-columns:1fr; } }
.strategy-item {
  background:rgba(255,255,255,.03); border:1px solid var(--border);
  border-radius:12px; padding:14px 14px 14px 12px;
  display:flex; gap:10px; align-items:flex-start;
}
.strategy-item-num {
  font-size:1.45rem; font-weight:900; line-height:1.1;
  color:rgba(255,184,41,.22); flex-shrink:0;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums;
  margin-top:1px;
}
.strategy-item-body  { flex:1; }
.strategy-item-label { font-size:.86rem; font-weight:700; color:var(--text-1); margin-bottom:5px; }
